<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Университеты — Админка Scribbles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <meta name="viewport" content="width=1280">
    <style>
        body {
            font-family: Inter, "Noto Sans", sans-serif;
        }
    </style>
</head>

<body class="bg-white">
    <div class="flex min-h-screen">
        {% include "admin/partials/sidebar.html" %}
        {% if error %}
        <div id="custom-alert"
            class="fixed top-5 left-1/2 z-50 transform -translate-x-1/2 w-full max-w-md bg-red-50 border border-red-300 text-red-700 px-6 py-4 rounded-xl shadow-lg flex items-center gap-2">
            <i class="bi bi-exclamation-triangle text-2xl"></i>
            <span>{{ error }}</span>
            <button onclick="document.getElementById('custom-alert').remove()"
                class="ml-auto text-red-400 hover:text-red-700 text-2xl leading-none">&times;</button>
        </div>
        <script>
            setTimeout(function () {
                var alert = document.getElementById('custom-alert');
                if (alert) { alert.remove(); }
            }, 7000);
        </script>
        {% endif %}

        <div class="flex-1 p-10">
            <h2 class="text-2xl font-semibold mb-6">Университеты</h2>
            <form method="post" action="/admin/universities/add"
                class="mb-8 flex flex-col md:flex-row gap-4 items-end bg-[#f9f9fb] p-4 rounded-xl shadow-sm">
                <div>
                    <label class="block text-xs font-semibold mb-1">Название</label>
                    <input name="name" type="text" class="border rounded px-3 py-2 w-48" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Email-домен</label>
                    <input name="email_domain" type="text" class="border rounded px-3 py-2 w-48"
                        placeholder="например, amity.uz" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">URL изображения (необязательно)</label>
                    <input name="image_url" type="text" class="border rounded px-3 py-2 w-48" placeholder="https://...">
                </div>
                <button type="submit"
                    class="bg-purple-700 hover:bg-purple-800 text-white rounded px-5 py-2 font-semibold flex items-center gap-2">
                    <i class="bi bi-plus"></i> Добавить
                </button>
            </form>
            <div class="overflow-x-auto">
                <table class="min-w-full border rounded-xl bg-white">
                    <thead>
                        <tr class="bg-[#f0f2f5]">
                            <th class="p-2 font-semibold text-left">ID</th>
                            <th class="p-2 font-semibold text-left">Название</th>
                            <th class="p-2 font-semibold text-left">Email-домен</th>
                            <th class="p-2 font-semibold text-left">Изображение</th>
                            <th class="p-2 font-semibold text-left">Действия</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for u in universities %}
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-2">{{ u.id }}</td>
                            <td class="p-2">{{ u.name }}</td>
                            <td class="p-2">{{ u.email_domain }}</td>
                            <td class="p-2">
                                {% if u.image_url %}
                                <a href="#" class="text-purple-700 underline"
                                    onclick="showImageModal('{{ u.image_url }}', '{{ u.name }}'); return false;">
                                    Показать
                                </a>
                                {% else %}
                                <span class="text-gray-400">—</span>
                                {% endif %}
                            </td>



                            <td class="p-2">
                                <form method="post" action="/admin/universities/delete"
                                    onsubmit="return confirm('Удалить университет?');" style="display:inline;">
                                    <input type="hidden" name="university_id" value="{{ u.id }}">
                                    <button type="submit" class="text-red-600 hover:underline flex items-center gap-1">
                                        <i class="bi bi-trash"></i> Удалить
                                    </button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Модальное окно для показа изображения -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 relative max-w-lg w-full flex flex-col items-center">
            <button onclick="closeImageModal()"
                class="absolute top-2 right-2 text-2xl text-gray-400 hover:text-gray-700">&times;</button>
            <img id="modal-img" src="" alt="" class="max-h-96 mb-2">
            <div id="modal-caption" class="text-center text-sm text-gray-700"></div>
        </div>
    </div>
    <script>
        function showImageModal(url, caption) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal-caption').textContent = caption;
            document.getElementById('image-modal').classList.remove('hidden');
        }
        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-img').src = '';
            document.getElementById('modal-caption').textContent = '';
        }
        window.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeImageModal();
        });
    </script>

</body>

</html>
